<!doctype html>
<html lang="en" data-theme="avant-garde">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			(function() {
				try {
					var theme = localStorage.getItem('samara-ui-theme') || localStorage.getItem('tablix-ui-theme') || 'avant-garde';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
